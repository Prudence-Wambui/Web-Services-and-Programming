<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Harmony General Hospital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <img src="https://w7.pngwing.com/pngs/877/824/png-transparent-icon-hospital-computer-icons-medicine-others-miscellaneous-text-rectangle.png" alt="Hospital Logo" class="logo" />
    <h1>Harmony General Hospital</h1>
  </div>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="registration.html">Registration</a>
    <a href="records.html">Records</a>
    <a href="about.html">About Us</a>
    <a href="contact.html" class="active">Contacts</a>
  </nav>

  <div class="form-container">
    <h2>Contact Us</h2>
    <p>You can reach us through the following:</p>
    <ul>
      <li><strong>Phone:</strong> +254 712 345 678</li>
      <li><strong>Email:</strong> info@harmonyhospital.co.ke</li>
      <li><strong>Location:</strong> Upper Hill, Nairobi, Kenya</li>
    </ul>

    <h3>Send Us a Message</h3>
    <form>
      <label for="contactName">Your Name:</label>
      <input type="text" id="contactName" name="contactName" required>

      <label for="contactEmail">Email:</label>
      <input type="email" id="contactEmail" name="contactEmail" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <div class="form-buttons">
        <button type="submit">Send Message</button>
        <button type="reset">Clear</button>
      </div>
    </form>
  </div>

  <footer>

  </footer>
</body>
</html>
